<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>TRACE ERP CS Assistant</title>
  <style>
    body {
      width: 260px;
      padding: 16px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    h3 {
      margin: 0 0 8px 0;
      font-size: 0.95rem;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    p {
      font-size: 0.78rem;
      color: #94a3b8;
      margin: 0 0 12px 0;
      line-height: 1.4;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: bold;
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
      border: 1px solid #10b981;
    }
    ul {
      padding-left: 16px;
      margin: 8px 0;
      font-size: 0.72rem;
      color: #cbd5e1;
    }
    li { margin-bottom: 4px; }
  </style>
</head>
<body>
  <h3>⚡ TRACE ERP CS Assistant</h3>
  <p>1-Click Order Tagging Bar active on all Shopify Admin order pages.</p>
  <div class="status-badge">🟢 Connected to TRACE ERP</div>

  <div style="margin-top: 12px;">
    <strong style="font-size: 0.75rem; color: #94a3b8;">Hotkeys (Shortcuts):</strong>
    <ul>
      <li><code style="color: #38bdf8;">Alt + W</code> ➔ WhatsApp</li>
      <li><code style="color: #8b5cf6;">Alt + F</code> ➔ WhatsApp-In-Funnel</li>
      <li><code style="color: #3b82f6;">Alt + P</code> ➔ Prepaid</li>
      <li><code style="color: #f59e0b;">Alt + C</code> ➔ Claim</li>
      <li><code style="color: #ef4444;">Alt + X</code> ➔ Cancel Request</li>
    </ul>
  </div>
</body>
</html>
